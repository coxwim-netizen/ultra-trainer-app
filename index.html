async function ensureUserProfile(user) {
  if (!user) return null;
  var ref = db.collection("users").doc(user.uid);
  var snap = await ref.get();
  var now = new Date().toISOString();
  if (!snap.exists) {
    var data = {
      displayName: user.displayName || "",
      email: user.email || "",
      photoURL: user.photoURL || "",
      startDate: "",
      goalDistance: "80 km ultra",
      experienceLevel: "",
      preferredDays: "",
      notes: "",
      onboardingDone: false,
      stravaConnected: false,
      createdAt: now,
      updatedAt: now
    };
    await ref.set(data, {merge:true});
    return data;
  }
  return snap.data();
}

async function loadUserProfile(uid) {
  if (!uid) return null;

function computeState(sd, acts, plan) {
  if (!sd) return null;
  var start = localDate(sd);
  var today = new Date(); today.setHours(0,0,0,0);
  var actSet = {};
  acts.forEach(function(a){ actSet[(a.start_date||"").slice(0,10)] = true; });
  var pi = 0, missedYest = null, cmap = [];
  var cur = new Date(start);
  while (cur <= today && pi < plan.length) {
    var y = cur.getFullYear(), mo = String(cur.getMonth()+1).padStart(2,'0'), d = String(cur.getDate()).padStart(2,'0');
    var ds = y+"-"+mo+"-"+d;
    var t = plan[pi], isPast = new Date(cur) < today;
    var missed = isPast && !isRest(t) && !actSet[ds];
    var off = Math.floor((new Date(cur)-start)/86400000);
    cmap.push({date:ds, planIdx:pi, training:t, missed:missed, dayOffset:off});
    if (!missed) pi++;
    var yest = new Date(today); yest.setDate(today.getDate()-1);
    var yd = yest.getFullYear()+"-"+String(yest.getMonth()+1).padStart(2,'0')+"-"+String(yest.getDate()).padStart(2,'0');
    if (ds===yd && missed) missedYest = {date:ds, training:t};
    cur.setDate(cur.getDate()+1);
  }
  return {planIdx: Math.min(pi, plan.length-1), missedYest:missedYest, cmap:cmap};
}

function buildStrip(sd, el, cmap, pi, plan) {
  if (!sd) return [];
  plan = plan || [];
  var start = localDate(sd);
  var sdow = start.getDay()===0 ? 6 : start.getDay()-1;
  var ws = Math.floor(el/7)*7, pm = {};
  (cmap||[]).forEach(function(e){ pm[e.dayOffset]=e.training; });
  return Array.from({length:7}, function(_,i) {
    var off = ws+i, t;
    if (off < el) t = pm[off]||"Rust";
    else if (off === el) t = (plan && plan[pi]!==undefined) ? plan[pi] : "Rust";
    else t = (plan && plan[pi+(off-el)]!==undefined) ? plan[pi+(off-el)] : "Rust";
    return {training:t, dayLabel:DAYS[(sdow+off)%7], isToday:off===el};
  });
}

async function authedFetch(url, options) {
  options = options || {};
  var user = fbAuth.currentUser;
  if (!user) throw new Error("Niet ingelogd");
  var idToken = await user.getIdToken();
  var headers = Object.assign({}, options.headers || {}, {
    "Authorization": "Bearer " + idToken
  });
  return fetch(url, Object.assign({}, options, { headers: headers }));
}

async function callClaude(prompt, maxTok) {
  var res = await authedFetch("/api/claude", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      max_tokens: maxTok || 300,
      messages: [{role: "user", content: prompt}]
    })
  });
  var d = await res.json();
  if (!res.ok) {
    var extra = "";
    if (d.remaining!==undefined && d.dailyLimit) extra = " (" + d.remaining + "/" + d.dailyLimit + " over)";
    throw new Error((d.error || "AI fout") + extra + (d.requestId ? " [requestId: " + d.requestId + "]" : ""));
  }
  return {
    text: (d.content && d.content[0] && d.content[0].text) || "",
    usage: d.usage || null
  };
}

function startOfWeek(d) {
  var x = new Date(d);
  x.setHours(0,0,0,0);
  var dow = x.getDay()===0 ? 7 : x.getDay();
  x.setDate(x.getDate() - (dow-1));
  return x;
}
function endOfWeek(d) {
  var x = startOfWeek(d);
  x.setDate(x.getDate()+6);
  x.setHours(23,59,59,999);
  return x;
}
function formatKm(v) {
  return (Math.round(v*10)/10).toFixed(v>=100?0:1);
}
function sumDistanceKm(arr) {
  return arr.reduce(function(s,a){ return s + ((a.distance||0)/1000); }, 0);
}
function sumHours(arr) {
  return arr.reduce(function(s,a){ return s + (a.moving_time||0); }, 0) / 3600;
}
function bucketActivities(activities, period) {
  var ordered = sortedActivities(activities).slice().reverse();
  var now = new Date();
  var buckets = [];
  var start, end, labelFn, compareFn;
  if (period==="week") {
    start = startOfWeek(now);
    end = new Date(now);
    end.setHours(23,59,59,999);
    var todayDow = now.getDay()===0 ? 7 : now.getDay();
    for (var i=0;i<todayDow;i++) {
      var d = new Date(start); d.setDate(start.getDate()+i);
      buckets.push({key:i,label:["Ma","Di","Wo","Do","Vr","Za","Zo"][i],value:0,date:new Date(d)});
    }
    compareFn = function(aDate, bucket){ return aDate.toDateString()===bucket.date.toDateString(); };
  } else if (period==="month") {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now);
    end.setHours(23,59,59,999);
    for (var d=1; d<=now.getDate(); d++) {

    prevStart = new Date(now.getFullYear(), now.getMonth()-1, 1);
    prevEnd = new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59,999);

    curStart = new Date(now.getFullYear(), 0, 1);
    curEnd = new Date(now.getFullYear(), 11, 31, 23,59,59,999);

    prevEnd = new Date(now.getFullYear()-1, 11, 31, 23,59,59,999);

    previous: activities.filter(function(a){ return between(a, prevStart, prevEnd); })

      h("button",{key:"a",onClick:function(){ startStravaConnect(); },disabled:connecting || !(cfg && cfg.stravaClientId),style:{width:"100%",padding:"14px 16px",borderRadius:14,border:"none",background:(cfg && cfg.stravaClientId) ? "#fc4c02" : "#cbd5e1",color:"white",fontWeight:700,fontSize:15,cursor:(cfg && cfg.stravaClientId) ? "pointer":"not-allowed",boxShadow:"0 10px 24px rgba(252,76,2,0.18)",marginBottom:10}},connecting?"Bezig...":"Koppel Strava"),
      h("button",{key:"skip",onClick:function(){ nextWith({stravaConnected:false}, 4); },style:{width:"100%",padding:"13px 14px",borderRadius:14,border:"1px solid #e2e8f0",background:"white",color:"#475569",fontWeight:700,boxShadow:"none",marginBottom:10}},"Later"),
      h("button",{key:"back",onClick:function(){ setOnboardingStep(2); },style:{width:"100%",padding:"13px 14px",borderRadius:14,border:"1px solid #e2e8f0",background:"white",color:"#475569",fontWeight:700,boxShadow:"none"}},"Terug")
    ]);
  }

  return wrap([
    h("div",{key:"h",style:{fontSize:26,fontWeight:800,letterSpacing:"-0.03em",marginBottom:8}},"Wanneer start je?"),
    h("div",{key:"s",style:{fontSize:14,color:"#64748b",lineHeight:1.6,marginBottom:18}},"Dan zetten we je schema meteen goed."),
    h("input",{key:"i",type:"date",value:start,onChange:function(e){setStart(e.target.value);},style:{width:"100%",padding:"14px 15px",borderRadius:14,border:"1px solid #cbd5e1",fontSize:15,marginBottom:14}}),
    error && h("div",{key:"e",style:{fontSize:12,color:"#dc2626",marginBottom:10}},error),
    h("div",{key:"btns",style:{display:"flex",gap:10}},
      h("button",{onClick:function(){ setOnboardingStep(3); },style:{flex:1,padding:"13px 14px",borderRadius:14,border:"1px solid #e2e8f0",background:"white",color:"#475569",fontWeight:700,boxShadow:"none"}},"Terug"),
      h("button",{onClick:function(){
        if(!start) { setError("Kies eerst je startdatum."); return; }
        updateProfileField("startDate", start);
        saveProfilePatch({startDate:start,onboardingDone:true}).then(function(){ setOnboardingStep(-1); });
      },style:{flex:1,padding:"13px 14px",borderRadius:14,border:"none",background:"#ea580c",color:"white",fontWeight:700,boxShadow:"0 10px 24px rgba(234,88,12,0.18)"}},"Start programma")
    )
  ]);
}


function ProfileTab(props) {
  var user=props.user, profile=props.profile, profileLoad=props.profileLoad, profileSaving=props.profileSaving, profileErr=props.profileErr, updateProfileField=props.updateProfileField, saveProfilePatch=props.saveProfilePatch;
  var inputStyle = {width:"100%",padding:"12px 13px",borderRadius:12,border:"1px solid #cbd5e1",fontSize:14,background:"white",appearance:"none",WebkitAppearance:"none"};
  function field(label, key, placeholder, type) {
    return h("div",{style:{marginBottom:12}},
      h("label",{style:{display:"block",fontSize:12,fontWeight:700,color:"#475569",marginBottom:6}},label),
      h("input",{type:type||"text",value:profile[key]||"",placeholder:placeholder||"",onChange:function(e){updateProfileField(key,e.target.value);},style:inputStyle})
    );
  }
  return h("div",null,
    h("div",{style:{background:"linear-gradient(180deg,#ffffff 0%,#f8fafc 100%)",border:"1px solid #e2e8f0",borderRadius:18,padding:18,marginBottom:16,boxShadow:"0 14px 34px rgba(15,23,42,0.06)"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:12}},
        profile.photoURL ? h("img",{src:profile.photoURL,style:{width:56,height:56,borderRadius:"50%",objectFit:"cover"}}) : h("div",{style:{width:56,height:56,borderRadius:"50%",background:"#fff7ed",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}},"👤"),
        h("div",null,
          h("div",{style:{fontSize:20,fontWeight:800,letterSpacing:"-0.03em"}},profile.displayName || user.displayName || "Jouw profiel"),
          h("div",{style:{fontSize:13,color:"#64748b",marginTop:4}},profile.email || user.email || "")
        )
      ),
      h("div",{style:{fontSize:13,color:"#475569",lineHeight:1.6}},"Hier bewaar je wat de app over jou mag onthouden.")
    ),
    profileLoad && h("div",{style:{fontSize:13,color:"#64748b",marginBottom:12}},"Profiel laden..."),
    field("Naam","displayName","Je naam"),
    field("Startdatum","startDate","", "date"),
    h("div",{style:{marginBottom:12}},
      h("label",{style:{display:"block",fontSize:12,fontWeight:700,color:"#475569",marginBottom:6}},"Doel"),
      h("select",{value:profile.goalDistance||"80 km ultra",onChange:function(e){updateProfileField("goalDistance",e.target.value);},style:inputStyle},
        h("option",{value:"21 km"},"21 km"),
        h("option",{value:"42 km"},"42 km"),
        h("option",{value:"80 km ultra"},"80 km ultra")
      )
    ),
    h("div",{style:{marginBottom:12}},
      h("label",{style:{display:"block",fontSize:12,fontWeight:700,color:"#475569",marginBottom:6}},"Niveau"),
      h("select",{value:profile.experienceLevel||"",onChange:function(e){updateProfileField("experienceLevel",e.target.value);},style:inputStyle},
        h("option",{value:""},"Kies je niveau"),
        h("option",{value:"Ik begin net"},"Ik begin net"),
        h("option",{value:"Ik loop af en toe"},"Ik loop af en toe"),
        h("option",{value:"Ik loop regelmatig"},"Ik loop regelmatig"),
        h("option",{value:"Ik train al serieus"},"Ik train al serieus")
      )
    ),
    field("Voorkeursdagen","preferredDays","Bijv. di, do, zo"),
    h("div",{style:{marginBottom:12}},
      h("label",{style:{display:"block",fontSize:12,fontWeight:700,color:"#475569",marginBottom:6}},"Notities"),
      h("textarea",{value:profile.notes||"",placeholder:"Bijv. gevoelige knie, liever ochtendruns",onChange:function(e){updateProfileField("notes",e.target.value);},style:{width:"100%",minHeight:110,padding:"12px 13px",borderRadius:12,border:"1px solid #cbd5e1",fontSize:14,background:"white",resize:"vertical",fontFamily:"inherit"}})
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}},
      h("div",{style:{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:14,padding:14}},
        h("div",{style:{fontSize:11,color:"#64748b",fontWeight:700,textTransform:"uppercase",letterSpacing:0.8,marginBottom:6}},"Account"),
        h("div",{style:{fontSize:14,fontWeight:700}},user.providerData && user.providerData[0] && user.providerData[0].providerId === "password" ? "E-mail" : "Google")
      ),
      h("div",{style:{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:14,padding:14}},
        h("div",{style:{fontSize:11,color:"#64748b",fontWeight:700,textTransform:"uppercase",letterSpacing:0.8,marginBottom:6}},"Strava"),
        h("div",{style:{fontSize:14,fontWeight:700}},profile.stravaConnected ? "Gekoppeld" : "Nog niet gekoppeld")
      )
    ),
    profileErr && h("div",{style:{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:12,padding:12,fontSize:12,color:"#991b1b",marginBottom:12}},profileErr),
    h("button",{onClick:function(){saveProfilePatch({onboardingDone:true});},disabled:profileSaving,style:{width:"100%",padding:"12px 14px",borderRadius:12,border:"none",background:"#ea580c",color:"white",fontWeight:700,fontSize:14,cursor:"pointer",boxShadow:"0 10px 24px rgba(234,88,12,0.18)"}},profileSaving?"Opslaan...":"Profiel opslaan")
  );
}

function StravaTab(props) {
  var strava=props.strava,cfg=props.cfg,startStravaConnect=props.startStravaConnect,connecting=props.connecting,strErr=props.strErr,activities=props.activities,clearStravaState=props.clearStravaState;
  if (strava) return h("div",null,
    h("div",{style:{background:"#dcfce7",border:"1px solid #bbf7d0",borderRadius:12,padding:20,textAlign:"center",marginBottom:20}},
      h("div",{style:{fontSize:32,marginBottom:8}},"✅"),
      h("div",{style:{fontWeight:700,fontSize:17}},"Strava gekoppeld"),
      h("div",{style:{fontSize:12,color:"#888",marginTop:6}},activities.length+" activiteiten gesynchroniseerd")
    ),
    h("button",{onClick:clearStravaState,style:{width:"100%",padding:"10px",borderRadius:10,border:"1px solid #fca5a5",background:"white",color:"#dc2626",fontSize:13,cursor:"pointer"}},"Koppel los")
  );
  return h("div",null,
    h("p",{style:{fontSize:13,color:"#555",lineHeight:1.7,marginTop:0}},"Koppel Strava. Je geheime sleutel blijft veilig op Netlify."),
    h("div",{style:{background:"#f9fafb",border:"1px solid #eee",borderRadius:12,padding:14,marginBottom:16,fontSize:12,lineHeight:1.8}},
      h("strong",null,"Status")," — ", cfg && cfg.stravaClientId ? "Strava client ID gevonden." : "Nog geen STRAVA_CLIENT_ID in Netlify."
    ),
    h("button",{onClick:startStravaConnect,disabled:connecting || !(cfg && cfg.stravaClientId),style:{width:"100%",padding:"11px",borderRadius:10,border:"none",background:(connecting || !(cfg && cfg.stravaClientId))?"#ccc":"#ea580c",color:"white",fontSize:14,fontWeight:700,cursor:(connecting || !(cfg && cfg.stravaClientId))?"not-allowed":"pointer"}},connecting?"Bezig...":"Koppel Strava"),
    strErr && h("div",{style:{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:10,padding:12,marginTop:12,fontSize:12,color:"#dc2626"}},strErr)
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
} catch (e) {
  console.error(e);
  document.getElementById("root").innerHTML = '<div style="padding:24px;font-family:Inter,-apple-system,sans-serif;color:#0f172a"><h2 style="margin-bottom:8px">Dat ging mis.</h2><p style="color:#475569;line-height:1.6">De app kon niet starten. Vernieuw de pagina. Blijft dit gebeuren, upload dan de laatste build opnieuw.</p></div>';
}
</script>
